name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Tests
        working-directory: backend
        env:
          # The suite needs the development shortcuts; production refuses them.
          SECRET_KEY: ci-secret-key-not-used-anywhere-real
          DEBUG_OTP: "true"
          DEMO_MODE: "true"
        run: python -m pytest -q

      - name: Migration runs on an empty database
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-used-anywhere-real
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          python migrate.py
          python migrate.py   # twice, because it must be safe to re-run

  production-config:
    name: Production config is refused when unsafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Startup must refuse DEBUG_OTP in production
        working-directory: backend
        env:
          APP_ENV: production
          SECRET_KEY: a-long-enough-secret-key-for-this-check-000000
          DEBUG_OTP: "true"
        run: |
          python - <<'PY'
          import config
          problems = config.validate_for_production()
          assert any("DEBUG_OTP" in p for p in problems), problems
          print("refused as expected:", len(problems), "problem(s)")
          PY

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
