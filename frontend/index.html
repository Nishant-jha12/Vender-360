<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Inventory, billing and digital khata for neighbourhood retail." />
    <meta name="theme-color" content="#1a73e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vendor360</title>
    <script>
      // Applied before first paint so dark-mode users don't get a white flash.
      // React previously set this in a useEffect, i.e. after the page rendered.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode can throw on storage access */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
