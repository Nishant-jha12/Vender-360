# Serving the built frontend.
#
# The API sets its own security headers; a static host has to set its own, and
# these are the ones that matter for a page that holds a session token.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Everything the app needs comes from itself. 'unsafe-inline' covers the
    # theme script in index.html and Tailwind's injected styles; connect-src
    # must be widened to your API origin at deploy time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:8000; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    # Behind TLS only; harmless to leave here, essential once served over https.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed asset filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
